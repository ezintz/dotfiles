## Start window numbering at 1
set -g base-index 1
set-window-option -g pane-base-index 1

## Mouse: select and resize panes, and scroll into tmux's own history. Every
## cmux terminal runs inside tmux (tmux/cmux.zsh), so without this the wheel
## scrolls nothing: tmux draws on the alternate screen, which has no scrollback
## for cmux to scroll.
set -g mouse on
set -g history-limit 50000

## Enable focus events for terminals which supports them.
set -g focus-events on

## Address VIM mode switching delay (http://superuser.com/a/252717/65504).
set -s escape-time 0

## Truecolor. cmux reports TERM=xterm-256color, which tmux reads as 256 colours
## and would quantize 24-bit output (Claude Code, OneDark themes) down to.
set -as terminal-features ',xterm*:RGB'

## Let programs inside tmux reach the outer terminal: OSC 52 clipboard writes,
## and the notification/progress escapes agents send to cmux.
set -g set-clipboard on
set -g allow-passthrough on

## Disable aggressive resizing for iTerm integration.
setw -g aggressive-resize off

## Cursor: blinking underscore, matching the iTerm2 profiles and the Ghostty
## config cmux reads. The Ss/Se terminfo capabilities that carry a cursor-style
## change through to the outer terminal are already defined in both
## xterm-256color and tmux-256color, so no terminal-overrides entry is needed.
setw -g cursor-style blinking-underline

## Reboot survival. tmux itself outlives cmux quitting; tmux-resurrect writes
## the layout, working directories and pane contents to disk so they can be
## recreated after a reboot. tmux/cmux.zsh reads this same directory to decide
## whether to restore, so change both together.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
## Claude Code is deliberately not in @resurrect-processes: resurrect could only
## replay its argv, which names no conversation. tmux/claude-session.sh records
## the conversation id per pane and resumes exactly that one instead.
set -g @resurrect-hook-post-save-all '~/.dotfiles/tmux/claude-session.sh save'
set -g @resurrect-hook-post-restore-all '~/.dotfiles/tmux/claude-session.sh restore'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

## Saving. tmux-continuum is not used: it saves from a status-line hook, and
## cmux sessions run with the status line off, so it would never fire. Instead:
## every 5 minutes, and whenever a client detaches (cmux quitting detaches all
## of them at once, hence the lock so they do not write the save concurrently).
## The guard keeps a config reload from starting a second loop.
if -F '#{==:#{@autosave-loop},}' {
  set -g @autosave-loop 1
  run-shell -b 'while sleep 300 && tmux has-session 2>/dev/null; do ~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet; done'
}
set-hook -g client-detached {
  run-shell -b 'lock="${TMPDIR:-/tmp}/tmux-resurrect-save.lock"; mkdir "$lock" 2>/dev/null && { ~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet; rmdir "$lock"; }'
}

source-file -q ~/.tmux.conf.local
