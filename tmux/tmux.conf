## Start window numbering at 1
set -g base-index 1
set-window-option -g pane-base-index 1

## Mouse: select and resize panes, and scroll into tmux's own history. Every
## cmux terminal runs inside tmux (tmux/cmux.zsh), so without this the wheel
## scrolls nothing: tmux draws on the alternate screen, which has no scrollback
## for cmux to scroll.
set -g mouse on
set -g history-limit 50000

## Mouse selection, made to behave like Claude Code's own (and iTerm2's). tmux's
## default copies on release and leaves copy mode in the same step, so the
## selection vanishes the moment it is made -- a double-click shows nothing at
## all -- and a selection made while scrolled up also jumps the view back to the
## bottom. Instead the selection stays highlighted, already copied (set-clipboard
## below sends it to the macOS clipboard), until the next key, which leaves copy
## mode and still reaches the shell -- that is the mouse-selection key table,
## since copy-mode-vi binds nearly every letter itself. That holds scrolled up
## too, where the key also jumps back to the prompt: copy mode kept there once
## so its keys stayed usable, but a Cmd+V then arrived as copy-mode commands and
## the paste was lost. The table covers the mouse as well, so a click, a new
## selection or the wheel while scrolled up keeps the view and the table; at the
## bottom a click just leaves, and scrolling back down leaves copy mode (-e).
## Panes whose program takes the mouse itself (Claude Code) never reach these. Both copy-mode tables, because
## mode-keys follows $EDITOR.
##
## Codex takes the mouse too, but only to scroll: it selects nothing itself, so a
## drag or double-click in it came to nothing. @app-selects lets it keep the
## wheel and the single click, and hands the selection to tmux as in a shell.
##
## Double-click uses iTerm2's word characters, so a path or a-file_name.txt
## selects as one word, not tmux's default of stopping at every punctuation mark.
## A URL selects whole, scheme included: it is tried against separators that only
## end a URL, and kept when what is under the mouse starts with a scheme. The
## separators are swapped globally for the one command, because mouse_word reads
## the global value, not the session's. The bindings that use the two aliases
## are strings rather than {} blocks: a block is parsed with the whole file,
## before the command-alias lines have run, and would name unknown commands.
##
## The copy waits a moment (run -d, as tmux's own double-click binding does):
## entering copy mode or selecting marks the pane for a redraw, and tmux sends
## the pane's clipboard write (OSC 52) to cmux only once that redraw is done --
## without the wait a double- or triple-click filled tmux's buffer but never the
## macOS clipboard. A drag has had its redraws long before the button goes up.
set -g @word-separators '!"#$%&'"'"'()*,:;<=>?@[]^`{|}'
set -g @url-separators '"'"'"'<>()[]{}|^`'
set -gF word-separators '#{@word-separators}'
set -g @app-selects '#{&&:#{mouse_any_flag},#{!=:#{pane_current_command},codex}}'
set -s command-alias[100] 'mouse-select-word=set -gF word-separators "#{@url-separators}" ; if -F "#{m/r:^[[:alpha:]][[:alnum:]+.-]*://,#{mouse_word}}" {} { set -gF word-separators "#{@word-separators}" } ; send -X select-word ; set -gF word-separators "#{@word-separators}"'
set -s command-alias[101] 'mouse-keep-selection=run -d0.01 ; send -X copy-pipe-no-clear ; switch-client -T mouse-selection'
bind -n MouseDrag1Pane if -F '#{||:#{pane_in_mode},#{E:@app-selects}}' { send -M } { copy-mode -M -e }
bind -n DoubleClick1Pane "select-pane -t = ; if -F '#{||:#{pane_in_mode},#{E:@app-selects}}' { send -M } { copy-mode -H -e ; mouse-select-word ; mouse-keep-selection }"
bind -n TripleClick1Pane "select-pane -t = ; if -F '#{||:#{pane_in_mode},#{E:@app-selects}}' { send -M } { copy-mode -H -e ; send -X select-line ; mouse-keep-selection }"
bind -T copy-mode-vi MouseDragEnd1Pane mouse-keep-selection
bind -T copy-mode    MouseDragEnd1Pane mouse-keep-selection
bind -T copy-mode-vi MouseDown1Pane { select-pane ; send -X clear-selection }
bind -T copy-mode    MouseDown1Pane { select-pane ; send -X clear-selection }
bind -T copy-mode-vi DoubleClick1Pane "select-pane ; mouse-select-word ; mouse-keep-selection"
bind -T copy-mode    DoubleClick1Pane "select-pane ; mouse-select-word ; mouse-keep-selection"
bind -T copy-mode-vi TripleClick1Pane "select-pane ; send -X select-line ; mouse-keep-selection"
bind -T copy-mode    TripleClick1Pane "select-pane ; send -X select-line ; mouse-keep-selection"
## Any also catches mouse events, so the ones that must not clear the selection
## are bound first: the button release that follows a triple-click (tmux reports
## a double-click only once the triple-click window has passed, so that release
## has already gone by), and the wheel, which scrolls with the selection kept as
## it does from copy mode. SecondClick is the second press of a double-click,
## reported before the DoubleClick it adds up to; caught by Any it would leave
## copy mode and jump to the bottom before the word could be selected. Cmd+K
## (User0, see below) gets its own binding so that it still clears the pane,
## not only the selection. A pane can have left copy
## mode while the table is still active (the wheel reaching the bottom), hence
## the pane_in_mode guard: cancel outside a mode fails and ends the binding
## before the key is sent.
bind -T mouse-selection MouseUp1Pane { switch-client -T mouse-selection }
bind -T mouse-selection SecondClick1Pane { switch-client -T mouse-selection }
bind -T mouse-selection WheelUpPane { select-pane ; send -X -N 5 scroll-up ; switch-client -T mouse-selection }
bind -T mouse-selection WheelDownPane { if -F '#{e|>:#{scroll_position},0}' { select-pane ; send -X -N 5 scroll-down } ; switch-client -T mouse-selection }
bind -T mouse-selection MouseDown1Pane { if -F '#{e|>:#{scroll_position},0}' { select-pane ; send -X clear-selection ; switch-client -T mouse-selection } { send -X cancel } }
bind -T mouse-selection MouseDrag1Pane { select-pane ; send -X begin-selection }
bind -T mouse-selection DoubleClick1Pane "select-pane ; mouse-select-word ; mouse-keep-selection"
bind -T mouse-selection TripleClick1Pane "select-pane ; send -X select-line ; mouse-keep-selection"
bind -T mouse-selection User0 { if -F '#{pane_in_mode}' { send -X cancel } ; send-keys -R ; clear-history ; send-keys C-l }
bind -T mouse-selection Any { if -F '#{pane_in_mode}' { send -X cancel } ; send-keys }

## One Dark Pro colours for what tmux draws itself. Its defaults are solid
## accent blocks (yellow selection, position box and message line, cyan and
## magenta matches); here a fill is muted and an accent only ever colours text.
## The selection is ghostty/config's selection colours, so tmux's selection and
## Ghostty's own Shift+drag one look the same. Text on each fill is >= 4.5:1.
## -q: the copy-mode-* options are newer than the tmux on some servers.
set -gw mode-style 'bg=#323844,fg=#ABB2BF'
set -gwq copy-mode-position-style 'bg=#323844,fg=#61AFEF'
set -gwq copy-mode-match-style 'bg=#314365,fg=#ABB2BF'
set -gwq copy-mode-current-match-style 'bg=#42557B,fg=#DCDFE4'
set -gwq copy-mode-mark-style 'fg=#E06C75'
set -g message-style 'bg=#323844,fg=#ABB2BF'
set -g message-command-style 'bg=#323844,fg=#ABB2BF'

## Enable focus events for terminals which supports them.
set -g focus-events on

## Address VIM mode switching delay (http://superuser.com/a/252717/65504).
set -s escape-time 0

## Truecolor. cmux reports TERM=xterm-256color, which tmux reads as 256 colours
## and would quantize 24-bit output (Claude Code, OneDark themes) down to.
set -as terminal-features ',xterm*:RGB'

## Modified keys such as Shift+Enter (a newline in Claude Code's prompt). tmux
## otherwise reduces them to the plain key. "always" rather than "on" because
## Claude Code asks for the kitty keyboard protocol, which tmux does not
## implement, so it would never switch them on; csi-u is the encoding Claude
## Code reads.
set -s extended-keys always
## extended-keys-format is tmux 3.5+; older tmux (Ubuntu 22.04 ships 3.2a)
## rejects the option and reports an error on every config load.
if-shell 'tmux -V | awk "{exit !(\$2+0 >= 3.5)}"' 'set -s extended-keys-format csi-u'
set -as terminal-features ',xterm*:extkeys'

## Pass the pane's title (cwd from the shell, "✳ …" from Claude Code) on to the
## outer terminal. tmux otherwise keeps titles to itself and cmux's tab falls
## back to a generic "Terminal".
set -g set-titles on
set -g set-titles-string '#{pane_title}'

## Pass the pane's working directory (the OSC 7 the shell sends at every prompt)
## on to cmux, which starts a new tab where the current one is. tmux otherwise
## keeps it to itself (pane_path), and a new tab opened in whatever directory
## the current tab had started in. tmux sends it along with the title, so it
## needs set-titles above.
## A client reads its features when it attaches: a tab attached before this
## line was loaded keeps not sending it until cmux restarts.
set -as terminal-features ',xterm*:osc7'

## Hyperlinks (OSC 8), so Cmd+click opens a link a program marked as one, however
## it is wrapped: Codex's sign-in URL spans several lines, which cmux cannot
## recognise as one URL from the text alone. tmux keeps them to itself otherwise,
## and a tab attached before this line was loaded only gets them once cmux
## restarts.
set -as terminal-features ',xterm*:hyperlinks'

## Let programs inside tmux reach the outer terminal: OSC 52 clipboard writes,
## and the notification/progress escapes agents send to cmux.
set -g set-clipboard on
if-shell 'tmux -V | awk "{exit !(\$2+0 >= 3.3)}"' 'set -g allow-passthrough on'

## Disable aggressive resizing for iTerm integration.
setw -g aggressive-resize off

## Cursor: blinking underscore, matching the iTerm2 profiles and the Ghostty
## config cmux reads. The Ss/Se terminfo capabilities that carry a cursor-style
## change through to the outer terminal are already defined in both
## xterm-256color and tmux-256color, so no terminal-overrides entry is needed.
## cursor-style is tmux 3.5+, like extended-keys-format above.
if-shell 'tmux -V | awk "{exit !(\$2+0 >= 3.5)}"' 'setw -g cursor-style blinking-underline'

## Reboot survival. tmux itself outlives cmux quitting; tmux-resurrect writes
## the layout, working directories and pane contents to disk so they can be
## recreated after a reboot. tmux/cmux.zsh reads this same directory to decide
## whether to restore, so change both together.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
## Claude Code is deliberately not in @resurrect-processes: resurrect could only
## replay its argv, which names no conversation. tmux/claude-session.sh records
## the conversation id per pane and resumes exactly that one instead.
set -g @resurrect-hook-post-save-all '~/.dotfiles/tmux/claude-session.sh save'
set -g @resurrect-hook-post-restore-all '~/.dotfiles/tmux/claude-session.sh restore'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

## Saving. tmux-continuum is not used: it saves from a status-line hook, and
## cmux sessions run with the status line off, so it would never fire. Instead:
## every 5 minutes, and whenever a client detaches (cmux quitting detaches all
## of them at once, hence the lock so they do not write the save concurrently).
## The guard keeps a config reload from starting a second loop.
if -F '#{==:#{@autosave-loop},}' {
  set -g @autosave-loop 1
  run-shell -b 'while sleep 300 && tmux has-session 2>/dev/null; do ~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet; done'
}
## The trailing `true` matters: the detaches that lose the lock would otherwise
## exit 1, and tmux shows every failed run-shell in the pane.
set-hook -g client-detached {
  run-shell -b 'lock="${TMPDIR:-/tmp}/tmux-resurrect-save.lock"; if mkdir "$lock" 2>/dev/null; then ~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet; rmdir "$lock"; fi; true'
}

## Cmd+K, which ghostty/config sends as CSI 99 ~ because Ghostty's own
## clear_screen cannot see past tmux. Clears the visible pane and tmux's history,
## then Ctrl+L makes the program in the pane redraw (a shell prompt, Claude Code).
set -s user-keys[0] "\e[99~"
bind -n User0 { send-keys -R ; clear-history ; send-keys C-l }

## cmux's tab bar already does the status line's job. Set per session on
## creation, which covers sessions the cmux tab creates, sessions resurrect
## recreates after a reboot, and attaches cmux itself replays -- none of those
## paths go through one common attach command that could set it.
set-hook -g session-created {
  if -F '#{m:cmux-*,#{session_name}}' { set-option status off }
}

## Machine-local additions from the private overlay (bin/dotfiles).
source-file -q ~/.config/dotfiles/tmux.conf
